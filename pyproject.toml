[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methadata"
version = "0.1.0"
description = "Kolekcjoner Fejków – silnik łączenia reklam w wyjaśnialne grupy"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.20", "pyyaml>=6", "openapi-spec-validator>=0.7"]
media = ["Pillow>=10"]
# Moduły dodają własne extras tutaj (np. ocr = [...], vectors = [...], graph = [...]).

[project.entry-points."methadata.adapters"]
importer-files = "methadata.ingest.importer:get_adapters"
assets = "methadata.experiments.assets.adapters:get_adapters"
components = "methadata.clustering.components:ADAPTERS"
extract-html = "methadata.extractors.html:get_adapters"
network = "methadata.extractors.network:get_adapters"
media = "methadata.extractors.media:get_adapters"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"methadata.contracts" = ["schemas/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
