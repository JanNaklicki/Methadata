[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methadata"
version = "0.1.0"
description = "Kolekcjoner Fejków – silnik łączenia reklam w wyjaśnialne grupy"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.20", "pyyaml>=6", "openapi-spec-validator>=0.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
media = ["Pillow>=10"]
pdf = ["pypdf>=4"]
ocr = ["Pillow>=10", "rapidocr-onnxruntime>=1.2"]
graph = ["leidenalg>=0.10", "igraph>=0.11"]
density = ["numpy>=1.24", "scikit-learn>=1.3,<2"]
provenance = ["c2pa-python>=0.30", "cryptography>=42"]
perceptual = ["numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8"]
# Moduły dodają własne extras tutaj (np. ocr = [...], vectors = [...], graph = [...]).

[project.entry-points."methadata.adapters"]
importer-files = "methadata.ingest.importer:get_adapters"
assets = "methadata.experiments.assets.adapters:get_adapters"
dom = "methadata.experiments.dom.adapters:get_adapters"
components = "methadata.clustering.components:ADAPTERS"
linkage = "methadata.clustering.linkage:get_adapters"
density = "methadata.clustering.density:get_adapters"
leiden = "methadata.clustering.leiden:get_adapters"
overlapping = "methadata.clustering.overlapping:get_adapters"
medoids = "methadata.clustering.medoids:get_adapters"
extract-html = "methadata.extractors.html:get_adapters"
network = "methadata.extractors.network:get_adapters"
media = "methadata.extractors.media:get_adapters"
ocr-layout = "methadata.experiments.ocr_layout:get_adapters"
extract-code = "methadata.extractors.code:get_adapters"
source-payer = "methadata.sources.payer:get_adapters"
source-payee = "methadata.sources.payee:get_adapters"
source-mobile-app = "methadata.sources.mobile_app:get_adapters"
source-contact = "methadata.sources.contact:get_adapters"
source-affiliate = "methadata.sources.affiliate:get_adapters"
source-offer-id = "methadata.sources.offer_id:get_adapters"
source-media-provenance = "methadata.sources.media_provenance:get_adapters"
source-distribution = "methadata.sources.distribution:get_adapters"
extract-documents = "methadata.extractors.documents:get_adapters"
lexical = "methadata.experiments.lexical:get_adapters"
production-kit = "methadata.experiments.production_kit:get_adapters"
near-copy = "methadata.experiments.near_copy:get_adapters"
url-har = "methadata.experiments.url_har:get_adapters"
rare-motifs = "methadata.experiments.rare_motifs:get_adapters"
funnel = "methadata.experiments.funnel:get_adapters"
fusion = "methadata.clustering.fusion:get_adapters"
people-entities = "methadata.experiments.people_entities:get_adapters"
narrative-slots = "methadata.experiments.narrative_slots:get_adapters"
perceptual = "methadata.experiments.perceptual:get_adapters"

[tool.setuptools.packages.find]
where = ["src", "backend"]

[tool.setuptools.package-data]
"methadata_api" = ["demo_data/manifest.json", "demo_data/*/*.html", "demo_data/*/*.png", "demo_data/*/assets/*.png"]
"methadata.contracts" = ["schemas/v1/*.json"]
"methadata.experiments.people_entities" = ["data/*.json"]
"methadata.sources.offer_id" = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
