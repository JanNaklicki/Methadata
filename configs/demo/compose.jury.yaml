services:
  backend:
    environment:
      METHADATA_ANALYSIS_PROFILE: jury
      METHADATA_JURY_DATA_DIR: /jury
    volumes:
      - type: bind
        source: ${METHADATA_JURY_DATA_DIR:-./var/jury}
        target: /jury
        bind:
          create_host_path: false
  frontend:
    ports: !override
      - "127.0.0.1:5173:5173"
