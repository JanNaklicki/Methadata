# Start: docker compose up --build   (podgląd: http://localhost:5173)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        EXTRAS: ${METHADATA_EXTRAS:-web,media,pdf,perceptual}
        WITH_FFMPEG: ${METHADATA_WITH_FFMPEG:-0}
    environment:
      METHADATA_DATA_DIR: /data
      METHADATA_COLLECTION_MODELS: ${METHADATA_COLLECTION_MODELS:-0}
      METHADATA_HOST: 0.0.0.0
      METHADATA_PORT: "8000"
    volumes:
      - methadata-data:/data
      - ./data/reference_figures:/app/data/reference_figures:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  methadata-data:
